# STAGE 3a - Gera um APK de TESTE (app Android minimo com tela OpenGL ES 2 e toque).
# Ainda NAO carrega o Rigs of Rods: serve para confirmar que o app instala e abre no celular.
# O APK fica na aba "Releases" do repositorio (download direto) e tambem como artefato do run.
name: android-apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Criar projeto Android
        run: |
          mkdir -p apk-project/app/src/main/java/org/rigsofrods/mobile
          cd apk-project

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RoRMobile"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'org.rigsofrods.mobile'
              compileSdk 34
              defaultConfig {
                  applicationId 'org.rigsofrods.mobile'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '0.1-teste'
                  ndk { abiFilters 'arm64-v8a' }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application
                  android:label="RoR Mobile"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/org/rigsofrods/mobile/MainActivity.java <<'EOF'
          package org.rigsofrods.mobile;

          import android.app.Activity;
          import android.graphics.Color;
          import android.opengl.GLES20;
          import android.opengl.GLSurfaceView;
          import android.os.Bundle;
          import android.view.MotionEvent;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;

          public class MainActivity extends Activity {
              private GLSurfaceView glView;
              private TextView info;
              private String glInfo = "Iniciando OpenGL ES 2...";
              private volatile float touchX = -1f;
              private volatile float touchY = -1f;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  glView = new GLSurfaceView(this);
                  glView.setEGLContextClientVersion(2);
                  glView.setRenderer(new Scene());

                  info = new TextView(this);
                  info.setTextColor(Color.WHITE);
                  info.setTextSize(16f);
                  info.setPadding(32, 32, 32, 32);
                  refreshText("Toque na tela");

                  FrameLayout root = new FrameLayout(this);
                  root.addView(glView);
                  root.addView(info);
                  setContentView(root);
              }

              private void refreshText(String touch) {
                  info.setText("Rigs of Rods Mobile 0.1 (teste)\n"
                          + glInfo + "\n"
                          + "Motor do jogo: ainda nao carregado\n"
                          + touch);
              }

              @Override
              public boolean dispatchTouchEvent(MotionEvent e) {
                  int action = e.getActionMasked();
                  if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                      touchX = -1f;
                      touchY = -1f;
                      refreshText("Toque na tela");
                  } else {
                      touchX = e.getX();
                      touchY = e.getY();
                      refreshText("Toque: x=" + (int) touchX + " y=" + (int) touchY);
                  }
                  return super.dispatchTouchEvent(e);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  glView.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  glView.onResume();
              }

              private class Scene implements GLSurfaceView.Renderer {
                  private int w = 1;
                  private int h = 1;
                  private final long t0 = System.nanoTime();

                  @Override
                  public void onSurfaceCreated(GL10 gl, EGLConfig config) {
                      final String s = "GPU: " + GLES20.glGetString(GLES20.GL_RENDERER)
                              + " | GL: " + GLES20.glGetString(GLES20.GL_VERSION);
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              glInfo = s;
                              refreshText("Toque na tela");
                          }
                      });
                  }

                  @Override
                  public void onSurfaceChanged(GL10 gl, int width, int height) {
                      w = Math.max(1, width);
                      h = Math.max(1, height);
                      GLES20.glViewport(0, 0, w, h);
                  }

                  @Override
                  public void onDrawFrame(GL10 gl) {
                      float t = (System.nanoTime() - t0) / 1.0e9f;

                      // ceu
                      GLES20.glDisable(GLES20.GL_SCISSOR_TEST);
                      GLES20.glClearColor(0.45f, 0.70f, 0.95f, 1f);
                      GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT);

                      // agua (a altura oscila como uma onda)
                      int level = (int) (h * 0.35f + h * 0.02f * Math.sin(t * 2.0));
                      GLES20.glEnable(GLES20.GL_SCISSOR_TEST);
                      GLES20.glScissor(0, 0, w, level);
                      GLES20.glClearColor(0.05f, 0.25f, 0.45f, 1f);
                      GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT);

                      // marcador de toque
                      float tx = touchX;
                      float ty = touchY;
                      if (tx >= 0f) {
                          GLES20.glScissor((int) tx - 40, h - (int) ty - 40, 80, 80);
                          GLES20.glClearColor(1f, 0.8f, 0f, 1f);
                          GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT);
                      }
                      GLES20.glDisable(GLES20.GL_SCISSOR_TEST);
                  }
              }
          }
          EOF

      - name: Compilar APK (debug)
        working-directory: apk-project
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: cp apk-project/app/build/outputs/apk/debug/app-debug.apk RoRMobile-teste.apk && ls -la RoRMobile-teste.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RoRMobile-apk
          path: RoRMobile-teste.apk

      - name: Publicar em Releases (download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-teste-${{ github.run_number }}
          name: "APK de teste #${{ github.run_number }}"
          body: "App de teste: tela OpenGL ES 2 com toque. Ainda nao carrega o Rigs of Rods."
          prerelease: true
          files: RoRMobile-teste.apk
          
