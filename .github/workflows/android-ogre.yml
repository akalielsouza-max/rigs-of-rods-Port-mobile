# android-ogre: gera APENAS a libRoRRender.so (teste do OGRE/GLES2) e um APK de teste. Independente do android-link.
# Precisa do cache android-sysroot-v2 (criado pelo android-deps). EXPERIMENTAL / NAO TESTADO.
name: android-ogre
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ogre:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Conferir arquivos do app (detecta arquivo cortado ao colar)
        run: |
          for f in ogre-app/ror_render.cpp ogre-app/MainActivity.java ogre-app/ContentInstaller.java ogre-app/ror_android.cpp ogre-app/build_ror.sh; do
            if [ ! -f "$f" ]; then echo "ERRO: falta o arquivo $f no repositorio"; exit 1; fi
            if ! tail -n 3 "$f" | grep -q FIM_DO_ARQUIVO; then echo "ERRO: $f esta incompleto (cortado ao colar). Cole de novo."; exit 1; fi
            wc -c "$f"
          done

      - name: Instalar NDK r26d
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" > /dev/null
          echo "NDK_DIR=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "PREFIX=$GITHUB_WORKSPACE/sysroot" >> "$GITHUB_ENV"
          echo "CXX=$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" >> "$GITHUB_ENV"
          echo "CC=$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"

      - name: Restaurar sysroot (cache do android-deps)
        id: sysroot
        uses: actions/cache/restore@v4
        with:
          path: sysroot
          key: android-sysroot-v2

      - name: Verificar sysroot
        run: |
          if [ "${{ steps.sysroot.outputs.cache-hit }}" != "true" ]; then
            echo "ERRO: cache android-sysroot-v2 nao encontrado. Rode o workflow android-deps ate o fim e tente de novo."
            exit 1
          fi
          ls sysroot/include | head -30

      - name: Compilar libRoRRender.so
        id: s_lib
        run: |
          mkdir -p ogre-test
          { echo "set(SYS_INCS $PREFIX/include"
            for d in $(find "$PREFIX/include" -mindepth 1 -maxdepth 2 -type d -not -path "*/rapidjson*"); do echo "  $d"; done
            echo ")"
          } > ogre-test/incs.cmake

          cp ogre-app/ror_render.cpp ogre-test/ror_render.cpp

          cat > ogre-test/CMakeLists.txt <<'CMK'
          cmake_minimum_required(VERSION 3.18)
          project(RoRRender C CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)
          include(${CMAKE_SOURCE_DIR}/incs.cmake)

          set(CPUF $ENV{NDK_DIR}/sources/android/cpufeatures)
          add_library(cpufeatures STATIC ${CPUF}/cpu-features.c)
          target_include_directories(cpufeatures PUBLIC ${CPUF})
          target_compile_options(cpufeatures PRIVATE -fPIC -Wno-everything)

          add_library(RoRRender SHARED ${CMAKE_SOURCE_DIR}/ror_render.cpp)
          foreach(d ${SYS_INCS})
            target_compile_options(RoRRender PRIVATE "SHELL:-idirafter ${d}")
          endforeach()
          target_compile_definitions(RoRRender PRIVATE _LIBCPP_ENABLE_CXX17_REMOVED_AUTO_PTR _LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION)
          target_compile_options(RoRRender PRIVATE -fPIC -O1 -g0 -Wno-everything)
          file(GLOB all_libs ${PREFIX}/lib/*.a)
          file(GLOB ogre_plugin_libs ${PREFIX}/lib/OGRE/*.a)
          target_link_options(RoRRender PRIVATE -Wl,--no-undefined -Wl,--error-limit=0 -Wl,-Bsymbolic)
          target_link_libraries(RoRRender PRIVATE cpufeatures -Wl,--start-group ${ogre_plugin_libs} ${all_libs} -Wl,--end-group android log EGL GLESv2 z dl)
          CMK

          cmake -S ogre-test -B build-ogre -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DPREFIX="$PREFIX" 2>&1 | tail -5
          cmake --build build-ogre -j"$(nproc)" > build-ogre.log 2>&1 || true
          {
          echo "# libRoRRender.so (teste do OGRE)"
          ls -la build-ogre/libRoRRender.so 2>/dev/null || echo "libRoRRender.so NAO foi gerada"
          echo "## Erros"
          grep -a -E "error:|undefined symbol" build-ogre.log | sed 's#^.*/ogre-test/##' | sort -u | head -30 | cut -c1-300
          echo "## sysroot/lib/OGRE"
          ls sysroot/lib/OGRE | head -20
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test -f build-ogre/libRoRRender.so

      - name: Compilar libRoR.so (RoR com patches Android)
        id: s_ror
        continue-on-error: true
        run: bash ogre-app/build_ror.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Criar app
        id: s_app
        run: |
          TC="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          JNI=apk-project/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI" apk-project/app/src/main/java/org/rigsofrods/mobile
          "$TC/bin/llvm-readelf" -d build-ogre/libRoRRender.so | grep NEEDED | tee needed.txt | tee -a "$GITHUB_STEP_SUMMARY"
          cp build-ogre/libRoRRender.so "$JNI/libRoRRender.so"
          "$TC/bin/llvm-strip" --strip-unneeded "$JNI/libRoRRender.so"
          if grep -q "libc++_shared.so" needed.txt; then
            cp "$TC/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI/"
          fi
          if [ -f build-ror/libRoR.so ]; then
            "$TC/bin/llvm-readelf" -d build-ror/libRoR.so | grep NEEDED | tee -a "$GITHUB_STEP_SUMMARY"
            cp build-ror/libRoR.so "$JNI/libRoR.so"
            "$TC/bin/llvm-strip" --strip-unneeded "$JNI/libRoR.so"
          fi
          ls -la "$JNI" | tee -a "$GITHUB_STEP_SUMMARY"
          cd apk-project

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RoRMobile"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'org.rigsofrods.mobile'
              compileSdk 34
              defaultConfig {
                  applicationId 'org.rigsofrods.mobile'
                  minSdk 26
                  targetSdk 34
                  versionCode 5
                  versionName '0.5-ror'
                  ndk { abiFilters 'arm64-v8a' }
              }
              packaging {
                  jniLibs { useLegacyPackaging = true }
              }
              androidResources {
                  noCompress 'zip'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="RoR Mobile"
                  android:extractNativeLibs="true"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cp "$GITHUB_WORKSPACE/ogre-app/MainActivity.java" app/src/main/java/org/rigsofrods/mobile/MainActivity.java
          cp "$GITHUB_WORKSPACE/ogre-app/ContentInstaller.java" app/src/main/java/org/rigsofrods/mobile/ContentInstaller.java

      - name: Preparar conteudo do RoR (recursos + 1 mapa + 1 carro)
        id: s_content
        run: |
          A="$GITHUB_WORKSPACE/apk-project/app/src/main/assets/ror"
          mkdir -p "$A/resources" "$A/content"
          [ -d ror-src ] || git clone -q --depth 1 --branch 2026.01 https://github.com/RigsOfRods/rigs-of-rods.git ror-src
          # igual ao CMake do RoR: cada pasta de resources/ vira um .zip (sem sons e wallpapers, que sao grandes e nao servem agora)
          for d in ror-src/resources/*/; do
            n=$(basename "$d")
            case "$n" in sounds|wallpapers) continue;; esac
            (cd "$d" && zip -qr -9 "$A/resources/$n.zip" .)
          done

          cat > fetch_pack.py <<'PY'
          import io, sys, urllib.request, zipfile
          class Http(io.RawIOBase):
              def __init__(self, url):
                  self.url = url
                  self.pos = 0
                  self.size = int(urllib.request.urlopen(urllib.request.Request(url, method="HEAD")).headers["Content-Length"])
              def seekable(self): return True
              def readable(self): return True
              def tell(self): return self.pos
              def seek(self, o, w=0):
                  self.pos = o if w == 0 else (self.pos + o if w == 1 else self.size + o)
                  return self.pos
              def read(self, n=-1):
                  if n < 0: n = self.size - self.pos
                  if n == 0 or self.pos >= self.size: return b""
                  end = min(self.pos + n, self.size) - 1
                  req = urllib.request.Request(self.url, headers={"Range": "bytes=%d-%d" % (self.pos, end)})
                  d = urllib.request.urlopen(req).read()
                  self.pos += len(d)
                  return d
              def readinto(self, b):
                  d = self.read(len(b)); b[:len(d)] = d; return len(d)
          pack, member, outdir = sys.argv[1], sys.argv[2], sys.argv[3]
          url = "https://github.com/CuriousMike56/ContentPacks/releases/download/2022.12/ContentPack_%s.zip" % pack
          final = urllib.request.urlopen(urllib.request.Request(url, method="HEAD")).geturl()
          z = zipfile.ZipFile(Http(final))
          data = z.read(member)
          open(outdir + "/" + member, "wb").write(data)
          print("OK", pack, member, len(data), "bytes")
          PY
          python3 fetch_pack.py Terrains airport.zip "$A/content"
          python3 fetch_pack.py LightVehicles Box69Camaro.zip "$A/content"
          {
          echo "## Conteudo embutido no app"
          du -sh "$A"
          ls -la "$A/resources" "$A/content"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compilar APK (debug)
        id: s_build
        working-directory: apk-project
        run: |
          set +e
          gradle assembleDebug --stacktrace > ../gradle.log 2>&1
          rc=$?
          {
          echo "## Gradle: codigo de saida $rc"
          grep -a -E "error:|FAILED|What went wrong" -A6 ../gradle.log | head -40 | cut -c1-250
          echo "## Gradle: ultimas linhas"
          tail -12 ../gradle.log | cut -c1-250
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Renomear APK
        run: cp apk-project/app/build/outputs/apk/debug/app-debug.apk RoRMobile-ogre.apk && ls -la RoRMobile-ogre.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar em Releases (download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ogre-apk-${{ github.run_number }}
          name: "APK OGRE #${{ github.run_number }}"
          body: "App de teste: o OGRE (GLES2) desenha numa superficie. Ainda nao e o jogo."
          prerelease: true
          files: RoRMobile-ogre.apk
          
