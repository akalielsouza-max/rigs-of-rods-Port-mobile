# STAGE 2b - COMPILA DE VERDADE (gera codigo objeto) e TENTA LIGAR o Rigs of Rods 2026.01 para Android arm64.
# Gera libRoR.so de teste com --no-undefined: a lista de simbolos indefinidos e o mapa do que falta portar
# (OIS, janela, etc.). NAO e um app funcional. EXPERIMENTAL / NAO TESTADO. Rode depois do android-deps.
# v3: alem de ligar, empacota a libRoR.so num APK de teste (Releases).
# v2: corrige -fPIC (-Bsymbolic), liga o nucleo da OIS (sem backend) e o cpufeatures do NDK.
name: android-link
on:
  workflow_dispatch:
    inputs:
      ror_ref:
        description: "Tag/commit do Rigs of Rods"
        default: "2026.01"
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Instalar NDK r26d
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" > /dev/null
          echo "NDK_DIR=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "PREFIX=$GITHUB_WORKSPACE/sysroot" >> "$GITHUB_ENV"
          echo "CXX=$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" >> "$GITHUB_ENV"
          echo "CC=$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"

      - name: Restaurar sysroot (cache do android-deps)
        id: sysroot
        uses: actions/cache/restore@v4
        with:
          path: sysroot
          key: android-sysroot-v2

      - name: Verificar sysroot
        run: |
          if [ "${{ steps.sysroot.outputs.cache-hit }}" != "true" ]; then
            echo "ERRO: cache android-sysroot-v2 nao encontrado. Rode o workflow android-deps ate o fim (todas as dependencias OK) e tente de novo."
            exit 1
          fi
          ls sysroot/include | head -30

      - uses: actions/checkout@v4
        with:
          repository: RigsOfRods/rigs-of-rods
          ref: ${{ inputs.ror_ref }}
          path: ror

      - name: Codigo da OIS (cabecalhos + nucleo independente de plataforma)
        run: |
          git clone --depth 1 --branch v1.4 https://github.com/wgois/OIS.git ois
          ls ois/includes | head
          ls ois/src | head -20
          # A OIS trata "qualquer coisa que nao seja Windows/Apple" como Linux e puxa o X11. No Android nao existe X11:
          # com este patch a OIS fica sem plataforma e createInputSystem apenas lanca excecao em tempo de execucao.
          sed -i 's|^#else //Probably Linux|#elif defined(__ANDROID__)\n#\tinclude <unistd.h>\n#else //Probably Linux|' ois/includes/OISPrereqs.h
          grep -n "__ANDROID__" ois/includes/OISPrereqs.h

      - name: Aplicar patches Android (temporario via sed; versao oficial em patches/)
        run: |
          # 0001: ErrorUtils.cpp nao conhecia a plataforma Android (macro _L do Language.h)
          sed -i 's/^#elif OGRE_PLATFORM == OGRE_PLATFORM_LINUX\r\?$/#elif OGRE_PLATFORM == OGRE_PLATFORM_LINUX || OGRE_PLATFORM == OGRE_PLATFORM_ANDROID/' ror/source/main/utils/ErrorUtils.cpp
          git -C ror diff --stat
          # Mumble (audio posicional) usa shm_open, que nao existe no Android: fica desligado (-DUSE_MUMBLE removido).

      - name: Gerar arquivos de versao
        run: |
          mkdir -p gen
          sed -e 's/@VERSION_YEAR@/2026/g' -e 's/@VERSION_MONTH@/01/g' -e 's/@VERSION_SUFFIX@//g' \
            ror/source/version_info/RoRVersionDef.h.in > gen/RoRVersionDef.h
          sed -e 's/@VERSION_YEAR@/2026/g' -e 's/@VERSION_MONTH@/01/g' -e 's/@VERSION_SUFFIX@//g' \
            -e 's/@BUILD_DATE@/ci/g' -e 's/@BUILD_TIME@/ci/g' \
            ror/source/version_info/RoRVersion.cpp.in > gen/RoRVersion.cpp

      - name: Montar CMake de teste
        run: |
          W="$GITHUB_WORKSPACE"
          { echo "set(RoR_INCS $W/gen $W/ror/source/version_info $W/ror/external/header_only $W/ror/external/angelscript_addons"
            for d in $(find ror/source/main -type d); do echo "  $W/$d"; done
            echo ")"
            echo "set(SYS_INCS $PREFIX/include"
            for d in $(find "$PREFIX/include" -mindepth 1 -maxdepth 2 -type d -not -path "*/rapidjson*"); do echo "  $d"; done
            [ -d ois/includes ] && echo "  $W/ois/includes"
            echo ")"
          } > incs.cmake
          mkdir -p link-test
          cat > link-test/CMakeLists.txt <<'CMK'
          cmake_minimum_required(VERSION 3.18)
          project(RoRLinkTest C CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)
          include(${INCS_FILE})
          file(GLOB_RECURSE srcs ${SRC}/source/main/*.cpp ${SRC}/external/angelscript_addons/*.cpp)
          list(APPEND srcs ${GEN}/RoRVersion.cpp)

          # --- OIS: so o nucleo independente de plataforma (sem backend). Fecha os simbolos OIS:: ---
          file(GLOB ois_srcs ${OIS_DIR}/src/*.cpp)
          add_library(OISCore STATIC ${ois_srcs})
          target_include_directories(OISCore PUBLIC ${OIS_DIR}/includes)
          target_compile_definitions(OISCore PUBLIC OIS_STATIC_BUILD)
          target_compile_options(OISCore PRIVATE -fPIC -Wno-everything)

          # --- cpufeatures do NDK: android_getCpuFamily / android_getCpuFeatures ---
          set(CPUF $ENV{NDK_DIR}/sources/android/cpufeatures)
          add_library(cpufeatures STATIC ${CPUF}/cpu-features.c)
          target_include_directories(cpufeatures PUBLIC ${CPUF})
          target_compile_options(cpufeatures PRIVATE -fPIC -Wno-everything)

          add_library(RoR SHARED ${srcs})
          target_include_directories(RoR PRIVATE ${RoR_INCS})
          foreach(d ${SYS_INCS})
            target_compile_options(RoR PRIVATE "SHELL:-idirafter ${d}")
          endforeach()
          target_compile_definitions(RoR PRIVATE USE_OPENAL USE_SOCKETW USE_ANGELSCRIPT AS_USE_NAMESPACE USE_CURL USE_CAELUM USE_PAGED
            _LIBCPP_ENABLE_CXX17_REMOVED_AUTO_PTR _LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION)
          target_compile_options(RoR PRIVATE "SHELL:-include ${SRC}/source/main/pch.h" -fPIC -O0 -g0 -Wno-everything)
          file(GLOB all_libs ${PREFIX}/lib/*.a)
          # -Bsymbolic: simbolos definidos dentro da .so deixam de ser "preemptivos" (corrige o erro -fPIC do lld)
          target_link_options(RoR PRIVATE -Wl,--no-undefined -Wl,--error-limit=0 -Wl,-Bsymbolic)
          target_link_libraries(RoR PRIVATE OISCore cpufeatures -Wl,--start-group ${all_libs} -Wl,--end-group android log EGL GLESv2 OpenSLES z dl)
          CMK
          cmake -S link-test -B build-link -G "Unix Makefiles" $CMAKE_TC -DCMAKE_BUILD_TYPE=Release \
            -DSRC="$W/ror" -DGEN="$W/gen" -DPREFIX="$PREFIX" -DINCS_FILE="$W/incs.cmake" -DOIS_DIR="$W/ois" 2>&1 | tail -15

      - name: Compilar e ligar (continua apos erros)
        run: |
          cmake --build build-link -j"$(nproc)" -- -k -Otarget > build-link.log 2>&1 || true
          tail -3 build-link.log
          ls -la build-link/*.so 2>/dev/null || echo "libRoR.so NAO foi gerada (esperado no primeiro teste)"

      - name: Relatorio
        run: |
          {
          echo "# Relatorio de compilacao+ligacao (arm64)"
          echo; echo "Objetos compilados: $(find build-link -name '*.o' | wc -l) de $(find ror/source/main ror/external/angelscript_addons -name '*.cpp' | wc -l)"
          echo; echo "## Arquivos .cpp com erro de COMPILACAO"
          grep -a -E "^[^ ]+\.cpp:[0-9]+:[0-9]+: (fatal )?error" build-link.log | sed 's#^.*/ror/##' | cut -d: -f1 | sort | uniq -c | sort -rn | head -20
          echo; echo "## Primeiros erros de compilacao"
          grep -a -E "error:" build-link.log | grep -v "undefined symbol" | sed 's#^.*/ror/##' | head -15 | cut -c1-250
          echo; echo "## LIGACAO: simbolos indefinidos: $(grep -a -c 'undefined symbol' build-link.log)"
          echo "### Por prefixo (top 25)"
          grep -a "undefined symbol" build-link.log | sed 's/.*undefined symbol: //' | sed -E 's/^(OIS::|Ogre::|MyGUI::|RoR::|AngelScript::|[A-Za-z_]+).*/\1/' | sort | uniq -c | sort -rn | head -25
          echo "### Primeiros 40 simbolos"
          grep -a "undefined symbol" build-link.log | sed 's/.*undefined symbol: //' | sort -u | head -40 | cut -c1-200
          } | tee report-link.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-results
          path: |
            report-link.md
            build-link.log

      # ======================= STAGE 3b: APK com a libRoR.so dentro =======================
      - uses: actions/setup-java@v4
        if: hashFiles('build-link/libRoR.so') != ''
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: hashFiles('build-link/libRoR.so') != ''
        with:
          gradle-version: "8.7"

      - name: Preparar Android SDK
        if: hashFiles('build-link/libRoR.so') != ''
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Criar app com a libRoR.so
        if: hashFiles('build-link/libRoR.so') != ''
        run: |
          TC="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          JNI=apk-project/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI" apk-project/app/src/main/java/org/rigsofrods/mobile

          echo "=== bibliotecas que a libRoR.so exige (NEEDED) ===" | tee -a "$GITHUB_STEP_SUMMARY"
          "$TC/bin/llvm-readelf" -d build-link/libRoR.so | grep NEEDED | tee needed.txt | tee -a "$GITHUB_STEP_SUMMARY"

          cp build-link/libRoR.so "$JNI/libRoR.so"
          "$TC/bin/llvm-strip" --strip-unneeded "$JNI/libRoR.so"
          if grep -q "libc++_shared.so" needed.txt; then
            cp "$TC/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI/"
          fi
          ls -la "$JNI" | tee -a "$GITHUB_STEP_SUMMARY"

          cd apk-project

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RoRMobile"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'org.rigsofrods.mobile'
              compileSdk 34
              defaultConfig {
                  applicationId 'org.rigsofrods.mobile'
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName '0.2-libRoR'
                  ndk { abiFilters 'arm64-v8a' }
              }
              packaging {
                  jniLibs { useLegacyPackaging = true }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="RoR Mobile"
                  android:extractNativeLibs="true"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/org/rigsofrods/mobile/MainActivity.java <<'EOF'
          package org.rigsofrods.mobile;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.app.ApplicationExitInfo;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.util.Arrays;
          import java.util.List;

          public class MainActivity extends Activity {
              private TextView out;
              private File statusFile;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  statusFile = new File(getFilesDir(), "load_status.txt");

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(20, 24, 30));
                  root.setPadding(32, 64, 32, 32);

                  Button btn = new Button(this);
                  btn.setText("Carregar libRoR.so");
                  root.addView(btn);

                  ScrollView scroll = new ScrollView(this);
                  out = new TextView(this);
                  out.setTextColor(Color.WHITE);
                  out.setTextSize(13f);
                  out.setTextIsSelectable(true);
                  scroll.addView(out);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  log("Rigs of Rods Mobile 0.2 (teste da libRoR.so)");
                  log("Aparelho: " + Build.MANUFACTURER + " " + Build.MODEL
                          + " | Android " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")"
                          + " | ABIs: " + Arrays.toString(Build.SUPPORTED_ABIS));
                  log("");

                  String prev = read();
                  if ("STARTED".equals(prev)) {
                      log("ATENCAO: a tentativa anterior de carregar a libRoR.so TRAVOU o app (crash nativo).");
                  } else if (prev != null) {
                      log("Resultado da tentativa anterior: " + prev);
                  } else {
                      log("Nenhuma tentativa anterior. Toque no botao para carregar a libRoR.so.");
                  }
                  showExitReasons();

                  btn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          tryLoad();
                      }
                  });
              }

              private void showExitReasons() {
                  if (Build.VERSION.SDK_INT < 30) {
                      return;
                  }
                  try {
                      ActivityManager am = (ActivityManager) getSystemService(ACTIVITY_SERVICE);
                      List<ApplicationExitInfo> list = am.getHistoricalProcessExitReasons(getPackageName(), 0, 3);
                      for (ApplicationExitInfo i : list) {
                          String name;
                          if (i.getReason() == ApplicationExitInfo.REASON_CRASH_NATIVE) {
                              name = "CRASH_NATIVO";
                          } else if (i.getReason() == ApplicationExitInfo.REASON_CRASH) {
                              name = "CRASH_JAVA";
                          } else if (i.getReason() == ApplicationExitInfo.REASON_LOW_MEMORY) {
                              name = "POUCA_MEMORIA";
                          } else {
                              name = "codigo " + i.getReason();
                          }
                          log("Saida anterior do app: " + name + " | sinal/status=" + i.getStatus()
                                  + " | " + i.getDescription());
                      }
                  } catch (Throwable t) {
                      log("(nao foi possivel ler o historico de saidas: " + t + ")");
                  }
              }

              private void tryLoad() {
                  write("STARTED");
                  log("");
                  log("Carregando libRoR.so (pode demorar alguns segundos)...");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          String result;
                          try {
                              System.loadLibrary("RoR");
                              result = "OK";
                          } catch (Throwable t) {
                              result = "ERRO: " + t;
                          }
                          final String r = result;
                          write(r);
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  log("Resultado: " + r);
                              }
                          });
                      }
                  }).start();
              }

              private void log(String s) {
                  out.append(s + "\n");
              }

              private void write(String s) {
                  try {
                      FileOutputStream f = new FileOutputStream(statusFile);
                      f.write(s.getBytes("UTF-8"));
                      f.close();
                  } catch (Throwable ignored) {
                  }
              }

              private String read() {
                  try {
                      if (!statusFile.exists()) {
                          return null;
                      }
                      FileInputStream f = new FileInputStream(statusFile);
                      byte[] b = new byte[(int) statusFile.length()];
                      int n = f.read(b);
                      f.close();
                      return new String(b, 0, Math.max(n, 0), "UTF-8");
                  } catch (Throwable t) {
                      return null;
                  }
              }
          }
          EOF

      - name: Compilar APK (debug)
        if: hashFiles('build-link/libRoR.so') != ''
        working-directory: apk-project
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        if: hashFiles('build-link/libRoR.so') != ''
        run: cp apk-project/app/build/outputs/apk/debug/app-debug.apk RoRMobile-libRoR.apk && ls -la RoRMobile-libRoR.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar em Releases (download direto no celular)
        if: hashFiles('RoRMobile-libRoR.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-ror-${{ github.run_number }}
          name: "APK com libRoR #${{ github.run_number }}"
          body: "App de teste que tenta carregar a libRoR.so. Ainda nao e o jogo."
          prerelease: true
          files: RoRMobile-libRoR.apk
          
