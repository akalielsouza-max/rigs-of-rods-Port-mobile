# STAGE 2a - Varredura de compatibilidade do codigo do Rigs of Rods 2026.01 para Android arm64.
# NAO gera APK nem executavel. Roda clang -fsyntax-only em cada .cpp de source/main usando o sysroot
# do workflow android-deps e mostra quais modulos compilam e quais erros aparecem.
# EXPERIMENTAL / NAO TESTADO. Execute ANTES o android-deps (ele salva o cache android-sysroot-v1).
# Resultado vermelho nao acontece: o relatorio e a informacao. Leia o passo "Relatorio".
name: android-core
on:
  workflow_dispatch:
    inputs:
      ror_ref:
        description: "Tag/commit do Rigs of Rods"
        default: "2026.01"
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Instalar NDK r26d
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" > /dev/null
          echo "NDK_DIR=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "PREFIX=$GITHUB_WORKSPACE/sysroot" >> "$GITHUB_ENV"
          echo "CXX=$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" >> "$GITHUB_ENV"

      - name: Restaurar sysroot (cache do android-deps)
        id: sysroot
        uses: actions/cache/restore@v4
        with:
          path: sysroot
          key: android-sysroot-v1

      - name: Verificar sysroot
        run: |
          if [ "${{ steps.sysroot.outputs.cache-hit }}" != "true" ]; then
            echo "ERRO: cache android-sysroot-v1 nao encontrado. Rode o workflow android-deps ate o fim (todas as dependencias OK) e tente de novo."
            exit 1
          fi
          ls sysroot/include | head -30

      - uses: actions/checkout@v4
        with:
          repository: RigsOfRods/rigs-of-rods
          ref: ${{ inputs.ror_ref }}
          path: ror

      - name: Cabecalhos do OIS (so para checar a sintaxe; nao compilamos o OIS)
        continue-on-error: true
        run: |
          git clone --depth 1 --branch v1.4 https://github.com/wgois/OIS.git ois
          ls ois/includes | head

      - name: Gerar RoRVersionDef.h e montar flags
        run: |
          mkdir -p gen
          sed -e 's/@VERSION_YEAR@/2026/g' -e 's/@VERSION_MONTH@/01/g' -e 's/@VERSION_SUFFIX@//g' \
            ror/source/version_info/RoRVersionDef.h.in > gen/RoRVersionDef.h
          {
            echo "-std=c++17 -DUSE_OPENAL -DUSE_SOCKETW -DUSE_ANGELSCRIPT -DAS_USE_NAMESPACE -DUSE_CURL -DUSE_CAELUM -DUSE_PAGED -DUSE_MUMBLE"
            echo "-include ror/source/main/pch.h -Wno-everything"
            echo "-Igen -Iror/source/version_info -Iror/external/header_only -Iror/external/angelscript_addons"
            for d in $(find ror/source/main -type d); do echo "-I$d"; done
            [ -d ois/includes ] && echo "-Iois/includes"
            echo "-isystem $PREFIX/include"
            for d in $(find "$PREFIX/include" -mindepth 1 -maxdepth 2 -type d); do echo "-isystem $d"; done
          } | tr '\n' ' ' > flags.txt
          wc -w flags.txt

      - name: Varredura e relatorio (clang -fsyntax-only)
        run: |
          cat > sweep.py <<'PY'
          #!/usr/bin/env python3
          """Varredura de compatibilidade: roda clang -fsyntax-only em cada .cpp de source/main
          e gera um relatorio por modulo + os erros mais comuns. Nao gera codigo, so diagnostica."""
          import subprocess, os, glob, re, sys, collections, concurrent.futures as cf

          cxx = os.environ["CXX"]
          flags = open("flags.txt").read().split()
          root = sys.argv[1] if len(sys.argv) > 1 else "ror/source/main"
          outdir = "results"; os.makedirs(outdir, exist_ok=True)
          srcs = sorted(glob.glob(root + "/**/*.cpp", recursive=True))

          def run(f):
              p = subprocess.run([cxx] + flags + ["-fsyntax-only", "-ferror-limit=5", f],
                                 capture_output=True, text=True)
              return f, p.returncode, p.stderr

          res = []
          with cf.ThreadPoolExecutor(max_workers=os.cpu_count() or 2) as ex:
              for r in ex.map(run, srcs):
                  res.append(r)

          def module(f):
              rel = os.path.relpath(f, root)
              return rel.split(os.sep)[0] if os.sep in rel else "(raiz)"

          mods = collections.OrderedDict()
          msgs = collections.Counter(); headers = collections.Counter()
          for f, rc, err in res:
              m = module(f); d = mods.setdefault(m, [0, 0]); d[0 if rc == 0 else 1] += 1
              open(os.path.join(outdir, os.path.relpath(f, root).replace(os.sep, "__") + ".log"), "w").write(err)
              for line in err.splitlines():
                  h = re.search(r"fatal error: '([^']+)' file not found", line)
                  if h: headers[h.group(1)] += 1
                  e = re.search(r"error: (.*)", line)
                  if e and not h:
                      msgs[re.sub(r"'[^']*'", "'X'", e.group(1))[:140]] += 1

          ok = sum(1 for _, rc, _ in res if rc == 0)
          lines = ["# Relatorio de varredura (clang -fsyntax-only, arm64 Android)", "",
                   f"Arquivos: {len(res)} | compilam: {ok} | falham: {len(res)-ok}", "",
                   "| Modulo | OK | FALHA |", "|---|---|---|"]
          for m, (a, b) in sorted(mods.items()):
              lines.append(f"| {m} | {a} | {b} |")
          lines += ["", "## Cabecalhos nao encontrados (top 20)"]
          lines += [f"- {c}x `{h}`" for h, c in headers.most_common(20)] or ["- nenhum"]
          lines += ["", "## Mensagens de erro mais comuns (top 20)"]
          lines += [f"- {c}x {m}" for m, c in msgs.most_common(20)] or ["- nenhuma"]
          lines += ["", "## Arquivos que falham (primeiros 60)"]
          lines += [f"- {os.path.relpath(f, root)}" for f, rc, _ in res if rc != 0][:60]
          open(os.path.join(outdir, "REPORT.md"), "w").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          python3 sweep.py ror/source/main | tee report.txt
          cp results/REPORT.md "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-results
          path: results
