# STAGE 0 - Linux desktop build do Rigs of Rods tag 2026.01 (linha de base conhecida).
# Baseado em .github/workflows/linux-native.yml do repositorio oficial. NAO TESTADO por mim.
name: stage0-linux-baseline
on:
  workflow_dispatch:
    inputs:
      ror_ref:
        description: "Tag/commit do Rigs of Rods"
        default: "2026.01"
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxt-dev libxaw7-dev libzzip-dev \
            mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev libfreetype6-dev nvidia-cg-dev \
            libssl-dev libopenal-dev libois-dev libcurl4-openssl-dev rapidjson-dev gettext libfmt-dev ccache

      - uses: actions/checkout@v4
        with:
          repository: RigsOfRods/rigs-of-rods
          ref: ${{ inputs.ror_ref }}
          path: ror

      - name: Registrar commit exato
        run: git -C ror rev-parse HEAD | tee commit.txt

      - name: Build OGRE 1.11.6
        run: |
          git clone --depth 1 --branch v1.11.6 https://github.com/OGRECave/ogre.git && cd ogre
          cmake -DCMAKE_BUILD_TYPE=Release -DOGRE_BUILD_DEPENDENCIES=OFF -DOGRE_RESOURCEMANAGER_STRICT=0 \
            -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=FALSE -DOGRE_BUILD_TOOLS=FALSE -DOGRE_BUILD_SAMPLES=FALSE \
            -DOGRE_BUILD_COMPONENT_PROPERTY=FALSE -DOGRE_BUILD_COMPONENT_JAVA=FALSE \
            -DOGRE_BUILD_COMPONENT_CSHARP=FALSE -DOGRE_BUILD_COMPONENT_PYTHON=FALSE \
            -DOGRE_BUILD_PLUGIN_BSP=FALSE -DOGRE_BUILD_PLUGIN_PCZ=FALSE \
            -DOGRE_BUILD_COMPONENT_HLMS=FALSE -DOGRE_BUILD_COMPONENT_VOLUME=FALSE .
          make -j"$(nproc)"; sudo make install

      - name: Build MyGUI 3.4.0
        run: |
          git clone --depth 1 --branch MyGUI3.4.0 https://github.com/MyGUI/mygui.git && cd mygui
          cmake -DCMAKE_BUILD_TYPE=Release -DMYGUI_BUILD_DEMOS=FALSE -DMYGUI_BUILD_TOOLS=FALSE .
          make -j"$(nproc)"; sudo make install

      - name: Build Caelum, PagedGeometry, SocketW, AngelScript
        run: |
          set -e
          git clone --depth 1 https://github.com/RigsOfRods/ogre-caelum.git && (cd ogre-caelum && cmake -DCMAKE_BUILD_TYPE=Release -DCaelum_BUILD_SAMPLES=FALSE -DINSTALL_OGRE_PLUGIN=OFF . && make -j"$(nproc)" && sudo make install)
          git clone --depth 1 https://github.com/RigsOfRods/ogre-pagedgeometry.git && (cd ogre-pagedgeometry && cmake -DCMAKE_BUILD_TYPE=Release . && make -j"$(nproc)" && sudo make install)
          git clone https://github.com/RigsOfRods/socketw.git && (cd socketw && cmake -DCMAKE_BUILD_TYPE=Release . && make -j"$(nproc)" && sudo make install)
          git clone --depth 1 --branch 2.35.1 https://github.com/AnotherFoxGuy/angelscript.git && (cd angelscript && cmake -DCMAKE_BUILD_TYPE=Release . && make -j"$(nproc)" && sudo make install)

      - name: Build Rigs of Rods
        working-directory: ror
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DROR_FORCE_SYSTEM_DEPENDENCIES=TRUE .
          make -j"$(nproc)"
          sudo make install

      - uses: actions/upload-artifact@v4
        with:
          name: stage0-commit
          path: commit.txt
          
